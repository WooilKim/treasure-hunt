<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>보물 캡슐 현황</title>
<style>
  :root { --bg:#2b1d12; --ink:#fff6ea; --muted:#c9b39a; --accent:#ff8a3d; --bar:#4a3424; }
  * { box-sizing:border-box; }
  html, body { min-height:100vh; }
  body { margin:0; background:radial-gradient(circle at 50% 0%, #4a2e18, var(--bg) 70%); color:var(--ink);
         font-family:-apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif; display:flex; align-items:center; justify-content:center; }
  main { text-align:center; padding:clamp(8px,2vh,24px) 16px; width:100%; max-width:1100px; }
  h1 { font-size:clamp(24px,4vw,48px); margin:0; }
  .sub { color:var(--muted); font-size:clamp(14px,2vw,22px); margin-top:8px; }
  .num { font-size:clamp(90px,min(26vw,27vh),320px); font-weight:900; line-height:1; color:var(--accent); margin:clamp(8px,2vh,24px) 0 0; font-variant-numeric:tabular-nums; transition:transform .3s; }
  .num.pop { transform:scale(1.08); }
  .label { font-size:clamp(18px,3vw,36px); color:var(--muted); }
  .bar { height:22px; background:var(--bar); border-radius:99px; overflow:hidden; margin:clamp(14px,3.3vh,36px) auto 10px; max-width:800px; }
  .fill { height:100%; background:linear-gradient(90deg,#ffb36b,var(--accent)); width:0; transition:width .6s; }
  .meta, .recent { color:var(--muted); font-size:clamp(14px,1.8vw,20px); }
  .recent { margin-top:clamp(8px,2.6vh,28px); min-height:1.5em; }
  .links { display:grid; grid-template-columns:1fr 1fr; gap:clamp(12px,2vw,28px); margin:clamp(12px,3vh,44px) auto 0; max-width:1000px; }
  .link { display:block; padding:clamp(14px,2vw,22px); border-radius:20px; background:rgba(255,246,234,.08); border:1px solid rgba(255,138,61,.5); color:inherit; text-decoration:none; transition:opacity .4s; }
  .link:active { background:rgba(255,138,61,.2); }
  .link.off { opacity:.35; }
  .link h2 { margin:0; font-size:clamp(18px,2.6vw,32px); }
  .link p { margin:6px 0 0; color:var(--muted); font-size:clamp(13px,1.6vw,20px); }
  .link .state { display:inline-block; margin-top:8px; padding:2px 10px; border-radius:99px; background:var(--bar); font-size:clamp(12px,1.4vw,16px); }
  .link .state:empty { display:none; }
</style>
</head>
<body>
<main>
  <h1>🎁 남은 보물 캡슐</h1>
  <div class="sub">캡슐을 찾으면 카드 뒷면 QR을 스캔하세요 · 1인 1개</div>
  <div class="num" id="num">–</div>
  <div class="label">개 남았어요</div>
  <div class="bar"><div class="fill" id="fill"></div></div>
  <div class="meta" id="meta"></div>
  <div class="recent" id="recent"></div>
  <div class="links">
    <a class="link" id="submit" href="photo.html">
      <h2>📸 사진 제출</h2><p>팀원 사진 1장 올리기</p><span class="state"></span>
    </a>
    <a class="link" id="vote" href="vote.html">
      <h2>💖 사진 투표</h2><p>하트 3개로 투표</p><span class="state"></span>
    </a>
  </div>
</main>
<script>
  let last = null;
  function render(s) {
    const num = document.getElementById("num");
    num.textContent = s.remaining;
    if (last !== null && s.remaining !== last) { num.classList.add("pop"); setTimeout(() => num.classList.remove("pop"), 300); }
    last = s.remaining;
    document.getElementById("fill").style.width = (s.total ? s.claimed / s.total * 100 : 0) + "%";
    document.getElementById("meta").textContent = `전체 ${s.total}개 중 ${s.claimed}개 발견`;
    document.getElementById("recent").textContent = s.recent.length ? "최근 발견: " + s.recent.map(n => "#" + n).join("  ") : "";
  }
  const API = "https://script.google.com/macros/s/AKfycby8HKXqPkX97I2Guch5uwMnYZJr5NBnLK8Hp6E-5kx3bEi8hus9x961uXILXo3azoH0/exec";
  async function tick() {
    try {
      const res = await fetch(API + "?api=stats", { credentials: "omit" });
      render(await res.json());
      setTimeout(tick, 3000);
    } catch (e) {
      document.getElementById("meta").textContent = "연결 확인 중…";
      setTimeout(tick, 5000);
    }
  }
  tick();

  // 사진 공모전 링크: 시트 config의 제출·투표 단계에 따라 흐리게 표시
  function phase(id, open, closedText) {
    const el = document.getElementById(id);
    el.classList.toggle("off", !open);
    el.querySelector(".state").textContent = open ? "" : closedText;
  }
  async function contestTick() {
    try {
      const res = await fetch(API + "?api=gallery", { credentials: "omit" });
      const g = await res.json();
      phase("submit", g.submit_open, "제출 마감");
      phase("vote", g.vote_open, "투표 닫힘");
    } catch (e) {}
    setTimeout(contestTick, 15000);
  }
  contestTick();
</script>
</body>
</html>
